services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
    volumes:
      - media_data:/app/uploads

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    # Nessuna porta pubblicata: l'accesso pubblico passa da Caddy (servizio "caddy").
    # Per un test in HTTP diretto puoi ripristinare: ports: ["8080:80"].

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"        # HTTP: redirect a HTTPS + validazione ACME di Let's Encrypt.
      - "443:443"      # HTTPS.
      - "443:443/udp"  # HTTP/3 (QUIC).
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificati e chiavi: NON perderli tra i restart.
      - caddy_config:/config

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:
