server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: ogni rotta sconosciuta ricade su index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API REST -> server Node.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 50m;
  }

  # File media caricati.
  location /uploads/ {
    proxy_pass http://server:4000;
  }

  # WebSocket Yjs per la collaborazione real-time.
  location /yjs/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
}

# Nota HTTPS (Fase requisiti non-funzionali): in produzione terminare TLS qui
# (certificati Let's Encrypt) o davanti con un proxy dedicato.
